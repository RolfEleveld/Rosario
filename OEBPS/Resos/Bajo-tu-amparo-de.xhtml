  <h2>Unter deinen Schutz und Schirm</h2>
  <p>
    Unter deinen Schutz und Schirm fliehen wir,<br/>
    o heilige Gottesgebärerin;
  </p>
  <p>
    verschmähe nicht unser Flehen in unseren Nöten,<br/>
    sondern erlöse uns allezeit von allen Gefahren,
  </p>
  <p>
    o glorreiche und gebenedeite Jungfrau.<br/>
    
  </p>
  <p>
    Amen.
  </p>
