  <h2>Sancte Gabriel Archangele</h2>
  <p>
    Deus, qui inter ceteros Angelos<br/>
    ad annuntiandum incarnationis tuae mysterium<br/>
    Gabrielem Archangelum elegisti:
  </p>
  <p>
    concede propitius,<br/>
    ut, qui festum eius celebramus in terris,<br/>
    ipsius patrocinium sentiamus in caelis.
  </p>
  <p>
    Amen.
  </p>
