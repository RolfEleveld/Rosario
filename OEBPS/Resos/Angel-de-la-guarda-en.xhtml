  </nav>  <h2>Guardian Angel Prayer</h2>
  <p>
    Guardian angel, sweet companion,
  </p>
  <p>
    do not abandon me by night or day.<br/>
    Do not leave me alone, lest I perish.
  </p>
  <p>
    Do not depart from my side,<br/>
    for what would I do<br/>
    in my life without you?
  </p>
  <p>
    Amen.
  </p>
