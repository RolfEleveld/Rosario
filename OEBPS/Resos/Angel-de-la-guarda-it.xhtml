  <h2>Angelo custode</h2>
  <p>
    Angelo mio custode,<br/>
    dolce compagnia,<br/>
  </p>
  <p>
    non abbandonarmi né di notte né di giorno.<br/>
    Non lasciarmi solo, ché mi perderei.<br/>
  </p>
  <p>
    Non allontanarti da me,<br/>
    perché che cosa farei<br/>
    senza di te nella mia vita?<br/>
  </p>
  <p>
    Amen.
  </p>
