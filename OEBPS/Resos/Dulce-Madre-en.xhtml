  </nav>  <h2>Sweetest Mother</h2>
  <p>
    Sweetest Mother, do not depart;<br/>
    do not turn your face away from us.
  </p>
  <p>
    Come with us everywhere;<br/>
    never leave us alone;
  </p>
  <p>
    and since you love us so much,<br/>
    as a true Mother,
  </p>
  <p>
    may the Father, and the Son, and the Holy Spirit<br/>
    bless us.
  </p>
  <p>
    Amen.
  </p>
