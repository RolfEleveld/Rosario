  <h2>Mater dulcissima</h2>
  <p>
    Mater dulcissima, ne discedas,<br/>
    ne vultum tuum a nobis avertas.
  </p>
  <p>
    Veni nobiscum ubique,<br/>
    numquam nos solos relinquas;
  </p>
  <p>
    Et quoniam nos tantum amas,<br/>
    ut vera Mater,
  </p>
  <p>
    fac ut nos benedicat<br/>
    Pater, et Filius, et Spiritus Sanctus.
  </p>
  <p>
    Amen.
  </p>
