  <h2>Sotto la tua protezione</h2>
  <p>
    Sotto la tua protezione cerchiamo rifugio,<br/>
    santa Madre di Dio;
  </p>
  <p>
    non disprezzare le suppliche di noi che siamo nella prova,<br/>
    ma liberaci da ogni pericolo
  </p>
  <p>
    o Vergine gloriosa e benedetta.
  </p>
  <p>
    Amen.
  </p>
