  <h2>Kreuzzeichen</h2>
  <p>
    Durch das Zeichen des heiligen Kreuzes,
  </p>
  <p>
    erlöse uns von unseren Feinden,
  </p>
  <p>
    o Herr, unser Gott.
  </p>
  <p>
    Im Namen des Vaters und des Sohnes und des Heiligen Geistes.
  </p>
  <p>
    Amen.
