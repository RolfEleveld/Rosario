  <h2>Gebet zum heiligen Erzengel Gabriel</h2>
  <p>
    O Gott, der du unter den übrigen Engeln<br/>
    den Erzengel Gabriel erwählt hast,<br/>
    das Geheimnis deiner Menschwerdung zu verkünden:
  </p>
  <p>
    verleihe gnädig,<br/>
    dass wir, die wir sein Fest auf Erden feiern,<br/>
    seinen Schutz im Himmel erfahren.
  </p>
  <p>
    Amen.
  </p>
