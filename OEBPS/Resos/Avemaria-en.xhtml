<body>
    <nav class="langs" style="text-align: right"><a href="Avemaria.xhtml" lang="es" xml:lang="es" title="Español">es</a> <a href="Avemaria-la.xhtml" lang="la" xml:lang="la" title="Latine">la</a> <a href="Avemaria-de.xhtml" lang="de" xml:lang="de" title="Deutsch">de</a> <a href="Avemaria-it.xhtml" lang="it" xml:lang="it" title="Italiano">it</a> <a href="Avemaria-en.xhtml" lang="en" xml:lang="en" title="English">en</a></nav>  <h2>Hail Mary</h2>
  <p class="self">
    Hail Mary,<br/>
    full of grace,<br/>
    the Lord is with you.<br/>
  </p>
  <p>
    Blessed are you among women,<br/>
    and blessed is the fruit of your womb, Jesus.<br/>
  </p>
  <p class="other">
    Holy Mary, Mother of God,<br/>
    pray for us sinners,<br/>
    now and at the hour of our death.<br/>
  </p>
  <p>
    Amen
  </p>
