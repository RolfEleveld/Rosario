  <h2>Schutzengel</h2>
  <p>
    Mein Schutzengel,<br/>
    mein lieber Begleiter,<br/>
  </p>
  <p>
    Verlass mich nicht bei Tag und Nacht.<br/>
    Lass mich nicht allein, damit ich nicht verloren gehe.<br/>
  </p>
  <p>
    Weiche nicht von meiner Seite,<br/>
    denn was könnte ich ohne dich tun<br/>
    in meinem Leben?<br/>
  </p>
  <p>
    Amen.
  </p>
