  <h2>Oratio iaculatoria</h2>
  <p>
    O mi Iesu,<br/>
    libera nos a peccatis nostris;<br/>
    libera nos ab ignibus gehennae;<br/>
    perduc in paradisum omnes animas,<br/>
    praesertim eas quae plus misericordia tua indigent.
  </p>
  <p>
    Maria, Mater gratiae,<br/>
    Mater misericordiae,<br/>
    tu nos ab hoste protege,<br/>
    et hora mortis suscipe.
  </p>
  <p>
    Amen
  </p>
