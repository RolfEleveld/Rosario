  <h2>Prayer to Saint Gabriel the Archangel</h2>
  <p>
    O God, who amongst all the angels<br/>
    didst choose the Archangel Gabriel<br/>
    to announce the mystery of thine Incarnation:
  </p>
  <p>
    mercifully grant<br/>
    that we who keep his feast on earth<br/>
    may feel the benefit of his patronage in heaven.
  </p>
  <p>
    Amen.
  </p>
