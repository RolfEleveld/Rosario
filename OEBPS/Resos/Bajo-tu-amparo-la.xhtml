  <h2>Sub tuum praesidium</h2>
  <p>
    Sub tuum praesidium confugimus,<br/>
    sancta Dei Genetrix;
  </p>
  <p>
    nostras deprecationes ne despicias in necessitatibus,<br/>
    sed a periculis cunctis
  </p>
  <p>
    libera nos semper,<br/>
    Virgo gloriosa et benedicta.
  </p>
  <p>
    Amen.
  </p>
