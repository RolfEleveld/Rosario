  <h2>Segno della Croce</h2>
  <p>
    Per il segno della santa Croce,
  </p>
  <p>
    dai nostri nemici,
  </p>
  <p>
    liberaci, o Signore, Dio nostro.
  </p>
  <p>
    Nel nome del Padre e del Figlio e dello Spirito Santo.
  </p>
  <p>
    Amen.
  </p>
