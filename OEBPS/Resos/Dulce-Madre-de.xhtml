  <h2>Süße Mutter</h2>
  <p>
    Süßeste Mutter, weiche nicht von uns,<br/>
    wende dein Angesicht nicht von uns ab.
  </p>
  <p>
    Komm überall mit uns,<br/>
    lass uns niemals allein;
  </p>
  <p>
    und weil du uns so sehr liebst,<br/>
    wie eine wahre Mutter,
  </p>
  <p>
    so segne uns<br/>
    der Vater und der Sohn und der Heilige Geist.
  </p>
  <p>
    Amen.
  </p>
