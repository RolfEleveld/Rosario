  <h2>Ave Maria</h2>
  <p class="self">
    Ave Maria,<br/>
    gratia plena,<br/>
    Dominus tecum.<br/>
  </p>
  <p>
    Benedicta tu in mulieribus,<br/>
    et benedictus fructus ventris tui, Iesus.<br/>
  </p>
  <p class="other">
    Sancta Maria, Mater Dei,<br/>
    ora pro nobis peccatoribus,<br/>
    nunc et in hora mortis nostrae.<br/>
  </p>
  <p>
    Amen
  </p>
