  <h2>Signum Crucis</h2>
  <p>
    Per signum sanctae Crucis,
  </p>
  <p>
    de inimicis nostris,
  </p>
  <p>
    libera nos, Domine, Deus noster.
  </p>
  <p>
    In nomine Patris, et Filii, et Spiritus Sancti.
  </p>
  <p>
    Amen.
  </p>
