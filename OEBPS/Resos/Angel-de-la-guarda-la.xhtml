  <h2>Angele Custos</h2>
  <p>
    Angele custos meus,<br/>
    dulcis comes,<br/>
  </p>
  <p>
    ne me deseras noctu neque interdiu.<br/>
    Ne me solum relinque, ne peream.<br/>
  </p>
  <p>
    Ne a latere meo discedas,<br/>
    nam quid sine te facerem<br/>
    in vita mea?<br/>
  </p>
  <p>
    Amen.
  </p>
