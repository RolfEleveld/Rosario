  <h2>Dolcissima Madre</h2>
  <p>
    Dolcissima Madre, non andare via,<br/>
    non distogliere il tuo sguardo da noi.
  </p>
  <p>
    Vieni con noi dovunque,<br/>
    non lasciarci mai soli;
  </p>
  <p>
    e poiché ci ami tanto,<br/>
    come vera Madre,
  </p>
  <p>
    fa' che ci benedica<br/>
    il Padre, il Figlio e lo Spirito Santo.
  </p>
  <p>
    Amen.
  </p>
