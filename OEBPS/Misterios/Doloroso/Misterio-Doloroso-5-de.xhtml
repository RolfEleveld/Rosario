  <h2>Das fünfte Geheimnis des schmerzhaften Rosenkranzes</h2>
  <h1>Die Kreuzigung Jesu</h1>
    <p>
    Und Jesus rief mit lauter Stimme, und sprach:<br/>
    „Vater, in deine Hände empfehle ich meinen Geist.“<br/>
    Und indem er dies sagte,<br/>
    verschied er.<br/>
    (Lk 23,46)
  </p>
  <p>Frucht des Geheimnisses: Beharrlichkeit</p>
