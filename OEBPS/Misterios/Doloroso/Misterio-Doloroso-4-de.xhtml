  <h2>Das vierte Geheimnis des schmerzhaften Rosenkranzes</h2>
  <h1>Jesus trägt das schwere Kreuz</h1>
    <p>
    Und sich selbst das Kreuz tragend,<br/>
    ging er hinaus zu dem Orte,<br/>
    den man Schädelstätte nennt, hebräisch aber Golgotha.<br/>
    (Joh 19,17)
  </p>
  <p>Frucht des Geheimnisses: Geduld</p>
