  <h2>Quinto mistero doloroso</h2>
  <h1>Gesù è crocifisso e muore in croce</h1>
    <p>
    E Gesù, gridando a gran voce, disse:<br/>
    «Padre,<br/>
    nelle tue mani consegno il mio spirito»;<br/>
    e, detto questo, spirò.<br/>
    (Lc 23,46)
  </p>
  <p>Frutto del mistero: Perseveranza</p>
