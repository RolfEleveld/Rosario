  <h2>Quintum Mysterium Dolorosum</h2>
  <h1>Crucifixiónem Dómini nostri Iesu Christi</h1>
  <p>
    Et clamans voce magna Iesus ait:<br/>
    “Pater,<br/>
    in manus tuas commendo spiritum meum”;<br/>
    et haec dicens exspiravit.<br/>
    (Lc 23, 46)
  </p>
  <p>Fructus mysterii: Perseverantia</p>
