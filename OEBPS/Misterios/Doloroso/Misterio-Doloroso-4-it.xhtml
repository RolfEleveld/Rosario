  <h2>Quarto mistero doloroso</h2>
  <h1>Gesù percorre la via del Calvario portando la croce</h1>
    <p>
    Ed egli, portando la croce,<br/>
    si avviò verso il luogo detto del Cranio,<br/>
    in ebraico Golgota.<br/>
    (Gv 19,17)
  </p>
  <p>Frutto del mistero: Pazienza</p>
