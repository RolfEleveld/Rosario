  <h2>Quinto Misterio Doloroso</h2>
  <h1>La Crucifixión</h1>
  <p>
    Y Jesús, con fuerte voz dijo:<br/>
    "Padre,<br/>
    <span class="indent">en tus manos encomiendo mi espíritu".</span><br/>
    Y al decir esto, expiró.<br/>
    (San Lucas 23, 46)
  </p>
  <p>El Fruto Del Misterio: La Perseverancia</p>
