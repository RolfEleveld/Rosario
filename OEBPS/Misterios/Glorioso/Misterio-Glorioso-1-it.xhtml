  <h2>Primo mistero glorioso</h2>
  <h1>Gesù è risorto e vivo</h1>
    <p>
    Ma egli disse loro:<br/>
    «Non abbiate paura!<br/>
    Voi cercate Gesù Nazareno, il crocifisso.<br/>
    È risorto, non è qui;<br/>
    ecco il luogo dove l’avevano posto».<br/>
    (Mc 16,6)
  </p>
  <p>Frutto del mistero: Fede</p>
