  <h1>Ascensiónem Dómini nostri Iesu Christi in cáelum</h1>
  <p>
    Et Dominus quidem Iesus,<br/>
    postquam locutus est eis,<br/>
    assumptus est in caelum<br/>
    et sedit a dextris Dei.<br/>
    (Mc 16, 19)
  </p>
