  <h2>Quintum Mysterium Gloriosum</h2>
  <h1>Coronatiónem Beátæ Maríæ Vírginis in cáelum</h1>
  <p>
    Et signum magnum apparuit in caelo:<br/>
    mulier amicta sole,<br/>
    et luna sub pedibus eius,<br/>
    et super caput eius corona stellarum duodecim.<br/>
    (Apc 12, 1)
  </p>
  <p>Fructus mysterii: Fiducia in intercessione Mariae</p>
