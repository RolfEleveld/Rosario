  <h2>Das zweite Geheimnis des glorreichen Rosenkranzes</h2>
  <h1>Die Himmelfahrt Jesu</h1>
    <p>
    Und nachdem der Herr Jesus<br/>
    zu ihnen gesprochen hatte,<br/>
    ward er in den Himmel aufgenommen,<br/>
    und sitzet zur Rechten Gottes.<br/>
    (Mk 16,19)
  </p>
  <p>Frucht des Geheimnisses: Hoffnung</p>
