  <h2>Primum Mysterium Gloriosum</h2>
  <h1>Resurrectiónem Dómini nostri Iesu Christi a mórtuis</h1>
  <p>
    Qui dicit illis:<br/>
    “Nolite expavescere!<br/>
    Iesum quaeritis Nazarenum crucifixum.<br/>
    Surrexit, non est hic;<br/>
    ecce locus, ubi posuerunt eum.”<br/>
    (Mc 16, 6)
  </p>
  <p>Fructus mysterii: Fides</p>
