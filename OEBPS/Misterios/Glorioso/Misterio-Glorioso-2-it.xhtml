  <h2>Secondo mistero glorioso</h2>
  <h1>Gesù ascende al cielo</h1>
    <p>
    Il Signore Gesù,<br/>
    dopo aver parlato con loro,<br/>
    fu elevato in cielo<br/>
    e sedette alla destra di Dio.<br/>
    (Mc 16,19)
  </p>
  <p>Frutto del mistero: Speranza</p>
