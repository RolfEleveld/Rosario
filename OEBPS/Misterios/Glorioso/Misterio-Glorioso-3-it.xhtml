  <h2>Terzo mistero glorioso</h2>
  <h1>Lo Spirito Santo scende su Maria e gli apostoli</h1>
    <p>
    …tutti furono colmati di Spirito Santo<br/>
    e cominciarono a parlare in altre lingue,<br/>
    come lo Spirito dava loro il potere di esprimersi.<br/>
    (At 2,4)
  </p>
  <p>Frutto del mistero: Amore di Dio</p>
