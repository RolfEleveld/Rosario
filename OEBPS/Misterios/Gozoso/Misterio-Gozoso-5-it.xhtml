  <h2>Quinto mistero gaudioso</h2>
  <h1>Maria e Giuseppe ritrovano Gesù nel Tempio, fra i dottori</h1>
    <p>
    Dopo tre giorni lo trovarono nel tempio,<br/>
    seduto in mezzo ai maestri,<br/>
    mentre li ascoltava<br/>
    e li interrogava.<br/>
    (Lc 2,46)
  </p>
  <p>Frutto del mistero: La gioia di ritrovare Gesù</p>
