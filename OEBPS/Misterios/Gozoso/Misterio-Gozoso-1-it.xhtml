  <h2>Primo mistero gaudioso</h2>
  <h1>L’angelo annuncia a Maria la nascita di Gesù</h1>
    <p>
    Entrando da lei, disse:<br/>
    «Rallégrati, piena di grazia:<br/>
    il Signore è con te».<br/>
    (Lc 1,28)
  </p>
  <p>Frutto del mistero: Umiltà</p>
