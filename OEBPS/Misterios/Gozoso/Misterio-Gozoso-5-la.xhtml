  <h2>Quintum Mysterium Gaudiosum</h2>
  <h1>Inventiónem Dómini nostri Iesu Christi in templo</h1>
  <p>
    Et factum est, post triduum<br/>
    invenerunt illum in templo<br/>
    sedentem in medio doctorum,<br/>
    audientem illos et interrogantem eos.<br/>
    (Lc 2, 46)
  </p>
  <p>Fructus mysterii: Gaudium in Iesu inveniendo</p>
