  <h2>Terzo mistero gaudioso</h2>
  <h1>Gesù, il Figlio di Dio, nasce dalla Vergine Maria</h1>
    <p>
    Diede alla luce il suo figlio primogenito,<br/>
    lo avvolse in fasce<br/>
    e lo pose in una mangiatoia,<br/>
    perché per loro non c’era posto nell’alloggio.<br/>
    (Lc 2,7)
  </p>
  <p>Frutto del mistero: Povertà di spirito</p>
