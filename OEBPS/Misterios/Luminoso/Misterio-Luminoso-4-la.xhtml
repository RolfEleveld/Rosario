  <h2>Quartum Mysterium Luminosum</h2>
  <h1>Transfiguratio</h1>
  <p>
    Et facta est, dum oraret,<br/>
    species vultus eius altera,<br/>
    et vestitus eius albus, refulgens.<br/>
    …<br/>
    Et vox facta est de nube dicens:<br/>
    “Hic est Filius meus electus; ipsum audite.”<br/>
    (Lc 9, 29-35)
  </p>
  <p>Fructus mysterii: Sanctitas</p>
